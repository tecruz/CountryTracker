version: 2
# Weekly Gradle and GitHub Actions updates.
# Version tables in README.md and ARCHITECTURE.md are generated by
# scripts/sync-docs-versions.py. Dependabot pull requests do not edit those
# files. .github/workflows/docs-sync.yml opens a follow-up pull request after
# a catalog change reaches the default branch, because that branch requires
# pull requests. Pre-releases are left eligible when the current pin is already
# a pre-release, so Material 3 can move from 1.5.0-beta02 to a later rc or stable.
updates:
  # Gradle dependencies
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "gradle"
    commit-message:
      prefix: "deps"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
