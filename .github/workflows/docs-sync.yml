name: Sync Documentation Versions

on:
  push:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docs-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Sync Docs Versions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Sync versions from Gradle configuration
        run: python3 scripts/sync-docs-versions.py

      - name: Open a pull request when documentation drifts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- README.md ARCHITECTURE.md; then
            echo "Documentation versions are already up to date."
            exit 0
          fi

          branch="docs/sync-dependency-versions"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add README.md ARCHITECTURE.md
          git commit -m "docs: sync dependency versions"
          git push --force origin "HEAD:$branch"

          existing="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            echo "Updated the existing pull request #$existing for $branch"
            exit 0
          fi

          gh pr create \
            --base "$GITHUB_REF_NAME" \
            --head "$branch" \
            --title "docs: sync dependency versions" \
            --body "$(cat <<'EOF'
          ## Description
          Regenerates the version tables in README.md and ARCHITECTURE.md from `gradle/libs.versions.toml`, the Gradle wrapper, and `app/build.gradle.kts`.

          The default branch requires changes to go through a pull request, so this workflow opens one instead of pushing directly.

          Generated by `scripts/sync-docs-versions.py`.

          ## Type of Change
          - [x] Documentation update

          ## How Has This Been Tested?
          - [x] `python3 scripts/sync-docs-versions.py --check` after the update

          ## Checklist
          - [x] Documentation matches the version catalog
          EOF
          )"
