name: Sync Documentation Versions

on:
  push:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Sync Docs Versions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Sync versions from Gradle configuration
        run: python3 scripts/sync-docs-versions.py

      - name: Commit documentation updates
        run: |
          if git diff --quiet -- README.md ARCHITECTURE.md; then
            echo "Documentation versions are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md ARCHITECTURE.md
          git commit -m "docs: sync dependency versions"
          git push
